<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Te Quiero Mucho</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            background: linear-gradient(135deg, #ffb6c1, #ffc0cb, #ffd1dc);
            position:relative;
        }

        /* Corazones flotando */
        .heart{
            position:absolute;
            color:#ff4d88;
            font-size:25px;
            animation: float 6s linear infinite;
            opacity:0.7;
        }

        @keyframes float{
            0%{
                transform: translateY(100vh) scale(0.5);
                opacity:0;
            }
            50%{
                opacity:1;
            }
            100%{
                transform: translateY(-120vh) scale(1.2);
                opacity:0;
            }
        }

        /* Tarjeta */
        .card{
            width:90%;
            max-width:700px;
            background:rgba(255,255,255,0.25);
            backdrop-filter: blur(10px);
            border:3px solid rgba(255,255,255,0.4);
            border-radius:30px;
            padding:50px;
            text-align:center;
            box-shadow:0 10px 40px rgba(0,0,0,0.2);
            position:relative;
            z-index:10;
        }

        .card h1{
            font-size:70px;
            color:#ff1f75;
            margin-bottom:20px;
            text-shadow:2px 2px 10px rgba(255,255,255,0.8);
        }

        .card p{
            font-size:24px;
            color:#b30059;
            line-height:1.7;
        }

        .emoji{
            font-size:45px;
            margin:20px 0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse{
            0%{
                transform: scale(1);
            }
            50%{
                transform: scale(1.2);
            }
            100%{
                transform: scale(1);
            }
        }

        /* Rosas decorativas */
        .rose{
            position:absolute;
            font-size:60px;
        }

        .rose1{
            top:15px;
            left:20px;
        }

        .rose2{
            top:15px;
            right:20px;
        }

        .rose3{
            bottom:15px;
            left:20px;
        }

        .rose4{
            bottom:15px;
            right:20px;
        }
    </style>
</head>
<body>

    <!-- Corazones -->
    <div class="heart" style="left:10%; animation-delay:0s;">❤</div>
    <div class="heart" style="left:20%; animation-delay:2s;">💖</div>
    <div class="heart" style="left:35%; animation-delay:4s;">💕</div>
    <div class="heart" style="left:50%; animation-delay:1s;">❤</div>
    <div class="heart" style="left:65%; animation-delay:3s;">💗</div>
    <div class="heart" style="left:80%; animation-delay:5s;">💖</div>
    <div class="heart" style="left:90%; animation-delay:2s;">💕</div>

    <!-- Tarjeta -->
    <div class="card">

        <div class="rose rose1">🌹</div>
        <div class="rose rose2">🌹</div>
        <div class="rose rose3">🌹</div>
        <div class="rose rose4">🌹</div>

        <div class="emoji">💖</div>

        <h1>Te Quiero Mucho</h1>

        <p>
            Gracias por existir 💕 <br><br>
            Eres una persona muy especial para mí y 
            siempre iluminas mis días con tu sonrisa 🌸
            <br><br>
            Nunca olvides lo importante que eres 💗
        </p>

        <div class="emoji">🌹💞🌹</div>

    </div>

</body>
</html>
